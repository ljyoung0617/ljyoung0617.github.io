<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>페이지 목록</title>
  <style>
    :root {
      --bg: #f4f5f7;
      --card: #ffffff;
      --ink: #1a1d21;
      --muted: #5c6570;
      --line: #e4e7eb;
      --accent: #0b5fff;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Pretendard", "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
      background: var(--bg);
      color: var(--ink);
      line-height: 1.45;
    }
    .wrap { max-width: 720px; margin: 0 auto; padding: 32px 20px 64px; }
    h1 { font-size: 28px; margin: 0 0 6px; letter-spacing: -0.03em; }
    .sub { color: var(--muted); margin: 0 0 24px; }
    .list { list-style: none; margin: 0; padding: 0; display: grid; gap: 12px; }
    .item {
      display: block;
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 18px 20px;
      text-decoration: none;
      color: inherit;
    }
    .item:hover { border-color: var(--accent); }
    .item-title { font-size: 18px; font-weight: 700; color: var(--accent); }
    .item-desc { margin-top: 6px; font-size: 14px; color: var(--muted); }
    .empty { color: var(--muted); font-size: 14px; }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>페이지 목록</h1>
    <p class="sub">아래에서 보고서로 이동합니다. 새 HTML을 같은 저장소에 넣고 아래 목록에 추가하면 됩니다.</p>
    <ul class="list" id="pages"></ul>
  </div>
  <script>
    const pages = [
      {
        href: "pension-deferral.html",
        title: "연금 감액·연기 수령 비교",
        desc: "소득 감액 5년(50%)과 수령 연기(연 7.2% 단리 가산)를 비교합니다. 65세 시작, 그해 연금은 수익의 절반만 반영합니다."
      }
    ];

    const list = document.getElementById("pages");
    if (!pages.length) {
      list.innerHTML = '<li class="empty">등록된 페이지가 없습니다.</li>';
    } else {
      list.innerHTML = pages.map((page) => `
        <li>
          <a class="item" href="${page.href}">
            <div class="item-title">${page.title}</div>
            <div class="item-desc">${page.desc}</div>
          </a>
        </li>
      `).join("");
    }
  </script>
</body>
</html>
