<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>travel</title>
  <style>
    :root {
      --bg: #f4f5f7;
      --card: #ffffff;
      --ink: #1a1d21;
      --muted: #5c6570;
      --line: #e4e7eb;
      --accent: #0b5fff;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Pretendard", "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
      background: var(--bg);
      color: var(--ink);
      line-height: 1.45;
    }
    .wrap { max-width: 720px; margin: 0 auto; padding: 32px 20px 64px; }
    .back { display: inline-block; margin-bottom: 16px; color: var(--accent); text-decoration: none; font-size: 14px; }
    h1 { font-size: 28px; margin: 0 0 6px; letter-spacing: -0.03em; }
    .sub { color: var(--muted); margin: 0 0 24px; }
    .list { list-style: none; margin: 0; padding: 0; display: grid; gap: 12px; }
    .item {
      display: block;
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 18px 20px;
      text-decoration: none;
      color: inherit;
    }
    .item:hover { border-color: var(--accent); }
    .item-title-row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    .item-title { font-size: 18px; font-weight: 700; color: var(--accent); }
    .item-tag {
      font-size: 11px;
      font-weight: 700;
      padding: 3px 8px;
      border-radius: 999px;
      background: #e8f0ff;
      color: var(--accent);
    }
    .item-file { margin-top: 4px; font-size: 12px; color: var(--muted); }
    .item-desc { margin-top: 6px; font-size: 14px; color: var(--muted); }
    .empty { color: var(--muted); font-size: 14px; }
  </style>
</head>
<body>
  <div class="wrap">
    <a class="back" href="../index.html">← 페이지 목록</a>
    <h1>travel</h1>
    <p class="sub">이 폴더의 페이지입니다.</p>
    <ul class="list" id="pages"></ul>
  </div>
  <script>
    const pages = [
      {
        href: "barcelona-restaurants-mobile.html",
        title: "바르셀로나 시내 고평점 식당",
        tag: "모바일",
        desc: "구글 지도 모바일 · 평점 4.5+ · 리뷰 1,000+ · 시 지도로 동네 필터."
      },
      {
        href: "barcelona-michelin-v2-mobile.html",
        title: "바르셀로나 미쉐린 식당",
        tag: "모바일",
        desc: "한 열 레이아웃, 큰 터치 영역, 접는 필터, 가로 막대 그래프."
      },
      {
        href: "barcelona-michelin-v2.html",
        title: "바르셀로나 미쉐린 식당",
        desc: "비교표와 동네 그래프 위치 교체, 페어링 항목 삭제, 이름·위치·메뉴 한글 병기."
      }
    ];

    const list = document.getElementById("pages");
    if (!pages.length) {
      list.innerHTML = '<li class="empty">등록된 페이지가 없습니다.</li>';
    } else {
      list.innerHTML = pages.map((page) => `
        <li>
          <a class="item" href="${page.href}">
            <div class="item-title-row">
              <div class="item-title">${page.title}</div>
              ${page.tag ? `<span class="item-tag">${page.tag}</span>` : ""}
            </div>
            <div class="item-file">${page.href}</div>
            <div class="item-desc">${page.desc}</div>
          </a>
        </li>
      `).join("");
    }
  </script>
</body>
</html>
